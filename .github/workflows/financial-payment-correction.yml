name: Financial payment correction

on:
  pull_request:
    paths:
      - "api/**"
      - "src/features/financial/**"
      - "src/features/orders/**"
      - "tests/financial-api/**"
      - ".github/workflows/financial-payment-correction.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install dependencies
        run: npm ci
      - name: Run application tests
        run: npm test
        env:
          VITE_FIREBASE_API_KEY: "test-api-key-not-for-deployment"
          VITE_FIREBASE_AUTH_DOMAIN: "demo-web-crm-ui-tests.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "demo-web-crm-ui-tests"
          VITE_FIREBASE_STORAGE_BUCKET: "demo-web-crm-ui-tests.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
      - name: Run financial API and Emulator integration tests
        run: npm run test:financial-api
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Check unused CSS
        run: npm run css:unused
      - name: Check whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
